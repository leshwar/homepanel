<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#151a22">
  <title>HomePanel</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/photoframe.css">
  <link rel="stylesheet" href="/clockfaces.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23151a22'/%3E%3Ccircle cx='16' cy='14' r='6' fill='%23f2b35b'/%3E%3Crect x='13' y='21' width='6' height='3' rx='1' fill='%23ede7dc'/%3E%3C/svg%3E">
</head>
<body>
  <!-- Background scene behind the glass tiles: soft floating shapes, colored by the
       chosen background (Settings → Display). Static, so it costs nothing to keep on screen. -->
  <div class="backdrop" aria-hidden="true">
    <svg class="bg-shapes" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
      <defs>
        <radialGradient id="sh-ball" cx="34%" cy="28%" r="75%">
          <stop offset="0" style="stop-color:var(--shape-hi)"/>
          <stop offset=".55" style="stop-color:var(--shape-mid)"/>
          <stop offset="1" style="stop-color:var(--shape-lo)"/>
        </radialGradient>
        <linearGradient id="sh-bar" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" style="stop-color:var(--shape-hi)"/>
          <stop offset=".6" style="stop-color:var(--shape-mid)"/>
          <stop offset="1" style="stop-color:var(--shape-lo)"/>
        </linearGradient>
        <linearGradient id="sh-ring" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" style="stop-color:var(--shape-hi)"/>
          <stop offset="1" style="stop-color:var(--shape-lo)"/>
        </linearGradient>
        <filter id="far" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
        <filter id="mid" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
      </defs>
      <!-- far: big and blurred -->
      <ellipse cx="860" cy="860" rx="190" ry="120" fill="url(#sh-ball)" filter="url(#far)" opacity=".55"/>
      <rect x="40" y="700" width="230" height="230" rx="60" fill="url(#sh-bar)" filter="url(#far)" opacity=".45"
            transform="rotate(-18 155 815)"/>
      <circle cx="170" cy="180" r="110" fill="none" stroke="url(#sh-ring)" stroke-width="34" filter="url(#far)" opacity=".4"/>
      <!-- middle distance -->
      <rect x="690" y="330" width="250" height="78" rx="39" fill="url(#sh-bar)" filter="url(#mid)" opacity=".7"
            transform="rotate(32 815 369)"/>
      <ellipse cx="520" cy="560" rx="62" ry="38" fill="url(#sh-ball)" filter="url(#mid)" opacity=".75"
               transform="rotate(-12 520 560)"/>
      <circle cx="300" cy="470" r="46" fill="none" stroke="url(#sh-ring)" stroke-width="14" filter="url(#mid)" opacity=".6"/>
      <!-- near: small and sharp -->
      <ellipse cx="640" cy="170" rx="34" ry="22" fill="url(#sh-ball)" opacity=".9" transform="rotate(14 640 170)"/>
      <rect x="400" y="300" width="70" height="22" rx="11" fill="url(#sh-bar)" opacity=".8" transform="rotate(-25 435 311)"/>
      <circle cx="905" cy="560" r="16" fill="url(#sh-ball)" opacity=".85"/>
      <circle cx="90" cy="420" r="10" fill="url(#sh-ball)" opacity=".8"/>
    </svg>
    <div class="room-light"></div>
  </div>
  <div id="app" class="app">
    <header class="top">
      <button class="clock" id="clock" aria-label="Show ambient clock">
        <span class="clock-time" id="clock-time">--:--</span>
        <span class="clock-sub" id="clock-sub"></span>
      </button>
      <div class="top-actions">
        <button class="btn-alloff" id="all-off" aria-label="Turn everything off">
          <svg class="i"><use href="#i-power"/></svg><span>All off</span>
        </button>
        <button class="icon-btn" id="open-frame" aria-label="Photo frame"><svg class="i"><use href="#i-image"/></svg></button>
        <button class="icon-btn" id="open-settings" aria-label="Settings"><svg class="i"><use href="#i-gear"/></svg></button>
      </div>
    </header>

    <section class="scenes" id="scenes" aria-label="Scenes"></section>
    <nav class="rooms" id="rooms" aria-label="Rooms"></nav>
    <main class="grid" id="grid" aria-live="polite"></main>
    <div class="conn" id="conn" hidden>Reconnecting to the panel…</div>
  </div>

  <!-- bottom sheet for device detail / TV remote -->
  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>

  <!-- full-screen settings -->
  <section class="page" id="settings" role="dialog" aria-modal="true" hidden></section>

  <!-- resting clock shown when idle; the face is drawn by js/clockfaces.js -->
  <div class="ambient" id="ambient" aria-label="Clock. Touch to wake." hidden>
    <div id="ambient-face"></div>
  </div>

  <!-- photo frame slideshow (js/photoframe.js) -->
  <section class="frame" id="frame" aria-label="Photo frame. Touch to exit." hidden>
    <div class="frame-photo"></div>
    <div class="frame-photo"></div>
    <div class="frame-clock" id="frame-clock"><div class="t" id="frame-time"></div><div class="d" id="frame-date"></div></div>
    <div class="frame-hint" id="frame-hint">Touch anywhere to exit</div>
    <div class="frame-empty" id="frame-empty" hidden></div>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>

  <!-- icons -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2V16h5v-.2c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/></symbol>
      <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0V7zM12 17v5"/></symbol>
      <symbol id="i-tv" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="12.5" rx="2"/><path d="M8 21h8"/></symbol>
      <symbol id="i-speaker" viewBox="0 0 24 24"><rect x="1.5" y="8.5" width="21" height="7" rx="2.5"/><path d="M6 12h.01M10 12h.01M14 12h.01M18 12h.01"/></symbol>
      <symbol id="i-switch" viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><rect x="9.5" y="6" width="5" height="7" rx="1.5"/></symbol>
      <symbol id="i-fan" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.6"/><path d="M12 10.4C12 6 13 3 15.5 3S19 6 12 10.4zM13.6 12c4.4 0 7.4 1 7.4 3.5S18 19 13.6 12zM12 13.6c0 4.4-1 7.4-3.5 7.4S5 18 12 13.6zM10.4 12C6 12 3 11 3 8.5S6 5 10.4 12z"/></symbol>
      <symbol id="i-vacuum" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="9" r="2.2"/><path d="M6.5 15.5h11"/></symbol>
      <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v8M6.4 6.6a8 8 0 1 0 11.2 0"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></symbol>
      <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4M3 12h18"/></symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z"/></symbol>
      <symbol id="i-coffee" viewBox="0 0 24 24"><path d="M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8zM17 10h1.5a2.5 2.5 0 0 1 0 5H17M8 2.5v2.5M12 2.5v2.5"/></symbol>
      <symbol id="i-door" viewBox="0 0 24 24"><path d="M5 21V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v17M3 21h18M15 12h.01"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 9.5V20h5v-6h4v6h5V9.5"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
      <symbol id="i-input" viewBox="0 0 24 24"><path d="M3 8h18v8H3zM6 8V5h12v3M7 12h.01M11 12h6"/></symbol>
      <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM17 9l5 6M22 9l-5 6"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
      <symbol id="i-rew" viewBox="0 0 24 24"><path d="M11 6l-7 6 7 6zM20 6l-7 6 7 6z"/></symbol>
      <symbol id="i-ff" viewBox="0 0 24 24"><path d="M13 6l7 6-7 6zM4 6l7 6-7 6z"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M5.5 7l1 13h11l1-13M9 7V4h6v3"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="M3 3l18 18M8.5 16.4a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 5.4-2.7M19 12.9a10 10 0 0 0-2-1.5M2 9.3a15 15 0 0 1 4.3-2.6M22 9.3A15 15 0 0 0 11 5.1M12 20h.01"/></symbol>
      <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a6.5 6.5 0 0 1 3.5 6"/></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
    </defs>
  </svg>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
