[project]
name = "homepanel"
version = "0.1.0"
description = "Open-source touch-screen smart home panel for Raspberry Pi: lights, plugs and TVs from many brands."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008", "B904", "E731", "E701", "E702", "B027"]  # B027: optional adapter hooks are intentionally empty
